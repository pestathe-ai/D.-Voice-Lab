name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_PASS: SlmwQO6kxEIe2Q24jcWYN39p
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup platforms
        run: |
          set -o pipefail
          chmod +x tool/setup_platforms.sh
          if ! ./tool/setup_platforms.sh 2>&1 | tee setup.log; then
            grep -n -i -E 'error|because|failed|version solving|requires|exception' setup.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=setup::$(cat err.txt)"
            exit 1
          fi
          flutter --version

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            grep -n -E 'error •' analyze.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=analyze::$(cat err.txt)"
            exit 1
          fi
          grep -n -E 'warning •' analyze.log | head -20 \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > warn.txt || true
          if [ -s warn.txt ]; then echo "::warning title=analyze-warnings::$(cat warn.txt)"; fi

      - name: Test
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|\.dart [0-9]+:[0-9]+' test.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      # Le librerie native per Linux servono solo alla prova vera delle voci
      # qui sul server (sul telefono sono già dentro l'APK).
      - name: Linux native libs for voice test
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev >/dev/null
          flutter create --platforms=linux . >/dev/null
          if ! flutter build linux --debug 2>&1 | tee linux.log; then
            grep -n -i -E 'error|failed|cmake' linux.log | tail -30 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=linux-libs::$(cat err.txt)"
            exit 1
          fi
          ls build/linux/x64/debug/bundle/lib | tr "\n" " " > libs.txt
          echo "::notice title=linux-libs::$(cat libs.txt)"

      - name: Real voice test
        continue-on-error: true
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="$PWD/build/linux/x64/debug/bundle/lib:${LD_LIBRARY_PATH:-}"
          mkdir -p samples
          status=0
          for pack in supertonic3:sherpa-onnx-supertonic-3-tts-int8-2026-05-11 it_IT-paola-medium:vits-piper-it_IT-paola-medium; do
            id=${pack%%:*}; folder=${pack#*:}
            curl -sSL -o "/tmp/$folder.tar.bz2" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$folder.tar.bz2"
            if DVOCE_PACK_ARCHIVE="/tmp/$folder.tar.bz2" DVOCE_PACK_ID="$id" DVOCE_OUT_DIR="$PWD/samples" \
                flutter test test/engine_real_test.dart --reporter expanded 2>&1 | tee "real-$id.log"; then
              res=$(grep -o 'DVOCE_RESULT.*' "real-$id.log" | tr '\n' ' ')
              echo "::notice title=voci-$id::OK $res"
            else
              grep -n -i -E 'error|failed|exception|Expected|Actual|Which|reason|\.dart [0-9]+:[0-9]+|Invalid|load|DVOCE_RESULT' "real-$id.log" | tail -30 \
                | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
              echo "::error title=voci-$id::$(cat err.txt)"
              status=1
            fi
          done
          ls -la samples
          exit $status

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee build.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|\.dart:[0-9]+' build.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=build::$(cat err.txt)"
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/

      - name: Sign APKs
        run: |
          set -o pipefail
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if ! "${BT}apksigner" sign --ks tool/signing/app.jks --ks-key-alias app \
                --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS "$apk" 2>&1 | tee sign.log; then
              echo "::error title=sign::$(tail -5 sign.log | tr '\n' ' ')"
              exit 1
            fi
            "${BT}apksigner" verify "$apk"
          done
          ls -la build/app/outputs/flutter-apk/*-release.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Voce – build ${{ github.run_number }}
          body: |
            Per quasi tutti i telefoni scarica **app-arm64-v8a-release.apk**.
            Telefoni molto vecchi: app-armeabi-v7a-release.apk.
            I file prova-*.wav sono esempi delle voci (Elena, Andrea, Paola) generati durante la build.
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            samples/*.wav
